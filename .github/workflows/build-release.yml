name: Build Release

# Releases are cut from version tags, not from a promotion branch.
#   git tag v1.1.0 && git push origin v1.1.0
#
# Produces unsigned macOS (dmg/zip) and Windows (nsis/zip) artifacts and
# attaches them to a draft GitHub Release for the architect to publish.
on:
  push:
    tags: ['v*']
  # Lets a build be produced without tagging, e.g. to hand a tester a build.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: presenter-pro

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: presenterpro-macos
          - os: windows-latest
            script: dist:win
            artifact: presenterpro-windows
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: presenter-pro/package-lock.json

      # Full install: electron-builder needs the real Electron binary to
      # package the app. There is no native-module rebuild here either —
      # better-sqlite3 ships N-API prebuilds (`build.npmRebuild: false`, no
      # postinstall script).
      - name: Install dependencies
        run: npm ci

      # A release must never be cut from code that fails the gate.
      - name: Completion gate
        run: npm run gate

      - name: Package
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          # Only the distributable files — not the unpacked app directories,
          # which are large and redundant with the dmg/zip.
          path: |
            presenter-pro/dist/*.dmg
            presenter-pro/dist/*.exe
            presenter-pro/dist/*.zip
            presenter-pro/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub Release
    needs: build
    # Only tag pushes produce a release; workflow_dispatch just leaves artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Unsigned builds for personal distribution.

            **macOS:** the app is unsigned, so the first launch needs
            right-click → Open rather than a double-click.

            **Windows:** SmartScreen will warn on first run; choose
            More info → Run anyway.
