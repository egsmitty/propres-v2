name: PR Checks

on:
  pull_request:
    # NO `branches:` filter, deliberately. Restricting this to `main` meant a
    # stacked PR (one targeting another feature branch) reported "no checks
    # reported" — a silent zero-signal merge, which is precisely what this
    # pipeline exists to prevent. Every PR gets the gate, whatever its base.
    #
    # Default activity types are opened/synchronize/reopened. `ready_for_review`
    # is NOT a default — it must be listed explicitly so the draft→ready
    # transition triggers a run. Per-job `if` skips work while the PR is still
    # a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # Allow running the same checks manually against a branch.
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: presenter-pro

jobs:
  gate:
    name: Gate (type-check, lint, test)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: presenter-pro/package-lock.json

      # --ignore-scripts skips Electron's own postinstall binary download —
      # the unit/lint/type-check steps below never launch Electron. There is
      # no native-module rebuild to skip: better-sqlite3 ships N-API prebuilds
      # (package.json's `build.npmRebuild` is `false`, and there is no
      # postinstall script), so neither this install nor the full installs
      # below ever compile it. The build job below installs in full because it
      # needs the Electron binary itself to run `electron-vite build`.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs type-check → lint → vitest, the same command the architect runs
      # locally. Keep this as one step so a failure points at the same gate.
      - name: Completion gate
        run: npm run gate

      # Formatting is checked separately from lint so a format-only failure is
      # obvious rather than buried in rule output.
      - name: Prettier check
        run: npm run format:check

      # Fails the job on any high/critical advisory in production dependencies.
      # Dev-only deps are excluded (never shipped); this is a fast, offline-ish
      # check, not a substitute for the release pipeline's own scrutiny.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build (${{ matrix.os }})
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows-only: this job is a smoke build (no native rebuild, no
        # packaging — see the install comment below). E2E already builds and
        # runs the app on macOS on every PR, so a macOS entry here would only
        # duplicate that build, not add coverage.
        os: [windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: presenter-pro/package-lock.json

      # Full install here: this job needs the real Electron binary to run
      # `electron-vite build` as a platform smoke test. There is still no
      # native-module rebuild involved (see the gate job's install comment).
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Branch protection points at THIS job only. Upstream jobs that are skipped
  # count as a pass, so protection keeps working when a job is added or gated.
  pr-gate:
    name: PR Gate
    needs: [gate, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job checks out nothing, so the workflow-level
    # `working-directory: presenter-pro` would point at a directory that does
    # not exist and bash would fail to start. Run from the workspace root.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require passing checks
        env:
          GATE: ${{ needs.gate.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$name failed (result=$result)"
              exit 1
            fi
            echo "$name: $result"
          }
          check gate "$GATE"
          check build "$BUILD"
          echo "All required checks passed or were appropriately skipped."
