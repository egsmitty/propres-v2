# Automated dependency updates. Every PR still runs the full PR Gate, so
# nothing lands unverified.
#
# Non-major updates are grouped into one PR per ecosystem per week so the PR
# list is not buried; majors arrive individually so each gets read. There is
# deliberately no `ignore` list — pinning things away from updates is how a
# dependency file quietly rots. Hold a specific update back only as a recorded
# decision, not here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /presenter-pro
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Keeps history Conventional-Commits shaped. Not enforced for Dependabot
      # (husky runs locally, not on GitHub) — this is for readable history.
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # Recorded decisions, not pre-emptive pins. Each entry names the reason and
    # the condition under which it should be removed. See tasks/fable-notes.md.
    ignore:
      # typescript-eslint supports <6.1; TS 7 also removed `baseUrl`. Deliberately
      # pinned to 5.x in Phase 6. Remove when typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Vite is pinned to 7 because electron-vite 5 peers on Vite ^5–^7 (plan U1).
      # @vitejs/plugin-react 6 peers on Vite ^8. Remove when electron-vite supports Vite 8.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react (latest 7.37) peers on ESLint ^9 only. Remove when it supports 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    # Electron majors are intentionally NOT grouped: an Electron upgrade is a
    # real migration with breakage risk and deserves its own plan and PR.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
